<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🔫 Pistoleitor</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #050812;
    font-family: system-ui, -apple-system, sans-serif;
    color: #e8ecf5;
    display: flex; align-items: center; justify-content: center;
  }
  .frame {
    width: min(800px, 100%);
    background: #0b1020;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .stats { display: flex; gap: 18px; font-size: 15px; letter-spacing: .5px; }
  .stats .reload { color: #ef476f; font-weight: 700; animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .stage { position: relative; display: flex; justify-content: center; }
  canvas { display: block; width: 100%; height: auto; cursor: crosshair; background: #0b1020; }
  .panel {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 12px;
    padding: 32px; background: rgba(11,16,32,.86);
  }
  .panel.hidden { display: none; }
  .panel h2 { margin: 0; font-size: 30px; }
  .panel p { margin: 0; max-width: 460px; line-height: 1.5; color: #b7c0d6; }
  .hint { color: #ffd166 !important; }
  .final { font-size: 22px; color: #06d6a0 !important; }
  .play {
    margin-top: 8px; background: #06d6a0; color: #06251c; border: none;
    border-radius: 10px; padding: 12px 28px; font-size: 18px; font-weight: 700;
    cursor: pointer; transition: transform .1s ease;
  }
  .play:hover { transform: scale(1.05); }
  .foot {
    margin: 0; padding: 10px 16px; text-align: center; font-size: 13px;
    color: #7d88a3; border-top: 1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="stats">
      <span>🎯 <b id="score">0</b></span>
      <span>⏱️ <b id="time">30</b>s</span>
      <span id="ammo">🔫 ▮▮▮▮▮▮</span>
      <span>🏆 <b id="best">0</b></span>
    </div>
  </div>
  <div class="stage">
    <canvas id="c" width="760" height="460"></canvas>
    <div class="panel" id="panel">
      <h2>🔫 Pistoleitor</h2>
      <p>Apunta con el ratón y haz clic para disparar. Tienes 6 balas; se recargan solas cuando se acaban. Los blancos rojos pequeños valen más.</p>
      <p class="hint">Dispones de 30 segundos. ¡Consigue la máxima puntuación!</p>
      <button class="play" id="playBtn">▶ Jugar</button>
    </div>
  </div>
  <p class="foot">Clic = disparar · Ratón = apuntar</p>
</div>

<script>
const GAME_DURATION = 30, MAX_AMMO = 6, RELOAD_MS = 900, SPAWN_MS = 850, TARGET_LIFETIME = 2200;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const el = id => document.getElementById(id);
const rand = (a, b) => Math.random() * (b - a) + a;
let best = Number(localStorage.getItem('pistoleitor-best') || 0);
el('best').textContent = best;
let status = 'idle', s = null, raf = null;

function reset() {
  s = { score:0, ammo:MAX_AMMO, reloading:false, reloadEnd:0, targets:[], particles:[],
        mouse:{x:-100,y:-100}, lastSpawn:0, startTime:performance.now(), shots:0, hits:0 };
}

function start() {
  reset(); status = 'playing';
  el('panel').classList.add('hidden');
  raf = requestAnimationFrame(loop);
}

function showPanel(html) {
  const p = el('panel');
  p.innerHTML = html;
  p.classList.remove('hidden');
  const b = p.querySelector('.play');
  if (b) b.addEventListener('click', start);
}

function shoot() {
  if (status !== 'playing' || s.reloading) return;
  if (s.ammo <= 0) { s.reloading = true; s.reloadEnd = performance.now() + RELOAD_MS; return; }
  s.ammo--; s.shots++;
  const { x, y } = s.mouse;
  for (let i = 0; i < 6; i++)
    s.particles.push({ x, y, vx:rand(-2,2), vy:rand(-2,2), life:1, color:'#ffd166', r:rand(1,3) });
  let hit = -1;
  for (let i = s.targets.length - 1; i >= 0; i--) {
    const t = s.targets[i];
    if (Math.hypot(t.x - x, t.y - y) <= t.r) { hit = i; break; }
  }
  if (hit >= 0) {
    const t = s.targets[hit]; s.hits++; s.score += t.points;
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI*2), sp = rand(1,5);
      s.particles.push({ x:t.x, y:t.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:t.color, r:rand(2,4) });
    }
    s.targets.splice(hit, 1);
  }
  if (s.ammo <= 0) { s.reloading = true; s.reloadEnd = performance.now() + RELOAD_MS; }
}

function loop(now) {
  const w = canvas.width, h = canvas.height;
  const remaining = Math.max(0, GAME_DURATION - (now - s.startTime) / 1000);

  if (s.reloading && now >= s.reloadEnd) { s.reloading = false; s.ammo = MAX_AMMO; }
  if (now - s.lastSpawn > SPAWN_MS) {
    s.lastSpawn = now;
    const r = rand(18, 34), small = r < 24;
    s.targets.push({ x:rand(r, w-r), y:rand(r+40, h-r), r, born:now,
                     color: small ? '#ef476f' : '#06d6a0', points: small ? 30 : 10 });
  }
  s.targets = s.targets.filter(t => now - t.born < TARGET_LIFETIME);

  ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  for (let gx = 0; gx < w; gx += 40) { ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke(); }
  for (let gy = 0; gy < h; gy += 40) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }

  for (const t of s.targets) {
    const age = (now - t.born) / TARGET_LIFETIME;
    const rr = t.r * (1 + Math.sin(now/120 + t.x) * 0.05);
    ctx.globalAlpha = age > 0.75 ? 1 - (age - 0.75) / 0.25 : 1;
    ctx.beginPath(); ctx.arc(t.x, t.y, rr, 0, Math.PI*2); ctx.fillStyle = t.color; ctx.fill();
    ctx.beginPath(); ctx.arc(t.x, t.y, rr*0.66, 0, Math.PI*2); ctx.fillStyle = '#0b1020'; ctx.fill();
    ctx.beginPath(); ctx.arc(t.x, t.y, rr*0.33, 0, Math.PI*2); ctx.fillStyle = t.color; ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (let i = s.particles.length - 1; i >= 0; i--) {
    const p = s.particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.04;
    if (p.life <= 0) { s.particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const { x, y } = s.mouse;
  ctx.strokeStyle = s.reloading ? '#ef476f' : '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-20,y); ctx.lineTo(x-6,y); ctx.moveTo(x+6,y); ctx.lineTo(x+20,y);
  ctx.moveTo(x,y-20); ctx.lineTo(x,y-6); ctx.moveTo(x,y+6); ctx.lineTo(x,y+20); ctx.stroke();

  el('score').textContent = s.score;
  el('time').textContent = Math.ceil(remaining);
  el('ammo').innerHTML = s.reloading
    ? '<span class="reload">RECARGANDO…</span>'
    : '🔫 ' + '▮'.repeat(s.ammo) + '▯'.repeat(MAX_AMMO - s.ammo);

  if (remaining <= 0) {
    status = 'over';
    const acc = s.shots === 0 ? 0 : Math.round((s.hits / s.shots) * 100);
    best = Math.max(best, s.score);
    localStorage.setItem('pistoleitor-best', String(best));
    el('best').textContent = best;
    showPanel('<h2>¡Tiempo!</h2><p class="final">Puntuación: <b>' + s.score +
      '</b></p><p>Precisión: <b>' + acc + '%</b> · Récord: <b>' + best +
      '</b></p><button class="play">↻ Jugar otra vez</button>');
    return;
  }
  raf = requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', e => {
  if (!s) return;
  const r = canvas.getBoundingClientRect();
  s.mouse.x = ((e.clientX - r.left) / r.width) * canvas.width;
  s.mouse.y = ((e.clientY - r.top) / r.height) * canvas.height;
});
canvas.addEventListener('mousedown', shoot);
el('playBtn').addEventListener('click', start);
</script>
</body>
</html>
